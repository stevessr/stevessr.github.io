name: Build and Deploy Hexo

on:
  push:
    branches:
      - sakura

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout the repository
      uses: actions/checkout@v3
      with:
        ref: sakura

    - name: Set up Node.js
      uses: actions/setup-node@v3
      with:
        node-version: '22'

    - name: Install Hexo and dependencies
      run: |
        npm install -g hexo-cli
        npm install -g pnpm 
        pnpm install --production

    - name: Build the Hexo site
      run: hexo generate

    - name: Deploy to blog-sakura repository
      run: |
        git config --global user.name "GitHub Actions"
        git config --global user.email "actions@github.com"
        rm -rf .git
        cd public
        git init
        git add .
        git commit -m "Deploy Hexo site"
        git push --force --quiet "https://${{ secrets.GITHUB_TOKEN }}@github.com/stevessr/blog-sakura.git" master:sakura
